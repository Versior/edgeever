name: Deploy edgeever-demo

# Self-contained deployment for demo.xaaxa.com.
# Syncs this Fork to upstream, then deploys straight to Cloudflare with wrangler.
# No Cloudflare GitHub App / Workers Builds connection is required.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "stable = latest formal Release tag, edge = upstream main"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - edge
      force:
        description: "Redeploy even when already aligned"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: edgeever-demo-deploy
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: tianma-if/edgeever
  UPDATE_CHANNEL: ${{ inputs.channel || 'stable' }}
  DEPLOY_DIR: .edgeever-deploy
  WORKER_NAME: edgeever
  EDGE_EVER_WORKER_NAME: edgeever
  EDGE_EVER_WORKERS_DEV: "true"
  EDGE_EVER_D1_DATABASE_NAME: edgeever
  EDGE_EVER_D1_DATABASE_ID: 91a3bea7-346c-48ef-a71e-9f9211be2ae4
  EDGE_EVER_R2_BUCKET_NAME: edgeever-resources
  EDGE_EVER_CUSTOM_DOMAIN: demo.xaaxa.com
  EDGE_EVER_AUTH_USERNAME: "2983699759"
  EDGE_EVER_SESSION_TTL_DAYS: "400"
  EDGE_EVER_AUTH_LOGIN_WINDOW_SECONDS: "900"
  EDGE_EVER_AUTH_LOGIN_USERNAME_MAX_ATTEMPTS: "5"
  EDGE_EVER_AUTH_LOGIN_USERNAME_COOLDOWN_SECONDS: "900"
  EDGE_EVER_AUTH_LOGIN_IP_MAX_ATTEMPTS: "30"
  EDGE_EVER_AUTH_LOGIN_IP_COOLDOWN_SECONDS: "300"
  EDGE_EVER_DEMO_MODE: "false"
  EDGE_EVER_DEPLOYMENT_URL: https://demo.xaaxa.com

jobs:
  deploy:
    name: Sync upstream and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      target_ref: ${{ steps.upstream.outputs.target_ref }}
      target_commit: ${{ steps.upstream.outputs.target_commit }}
      target_version: ${{ steps.upstream.outputs.target_version }}
      decision: ${{ steps.upstream.outputs.decision }}
      deployed: ${{ steps.deploy.outcome }}
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve upstream target
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main --tags --depth 1

          case "${UPDATE_CHANNEL}" in
            stable)
              target_ref="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
              ;;
            edge)
              target_ref="upstream/main"
              ;;
            *)
              echo "Unsupported channel: ${UPDATE_CHANNEL}" >&2
              exit 1
              ;;
          esac

          # Fetch the exact commit the target ref points at.
          git fetch upstream "refs/tags/${target_ref}:refs/tags/${target_ref}" --depth 1 2>/dev/null || true
          target_commit="$(git rev-parse "${target_ref}^{commit}")"
          target_version="$(git show "${target_commit}:package.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version","unknown"))')"

          current_version="$(python3 -c 'import json; print(json.load(open("package.json")).get("version","unknown"))')"
          current_commit="$(git rev-parse HEAD)"

          if [ "${FORCE:-false}" = "true" ]; then
            decision="forced"
          elif [ "${current_version}" = "${target_version}" ] && [ "${current_commit}" = "${target_commit}" ]; then
            decision="already_aligned"
          else
            decision="update"
          fi

          echo "target_ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "target_commit=${target_commit}" >> "${GITHUB_OUTPUT}"
          echo "target_version=${target_version}" >> "${GITHUB_OUTPUT}"
          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "decision=${decision}" >> "${GITHUB_OUTPUT}"

          {
            echo "### EdgeEver deploy / 部署"
            echo ""
            echo "| Field / 字段 | Value / 值 |"
            echo "| --- | --- |"
            echo "| Channel / 通道 | \`${UPDATE_CHANNEL}\` |"
            echo "| Upstream target / 上游目标 | \`${target_ref}\` (v${target_version}) |"
            echo "| Fork main / 当前 | \`${current_commit:0:12}\` (v${current_version}) |"
            echo "| Decision / 判定 | \`${decision}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          # Build in a separate directory so this Fork's main does not need to be
          # rewritten by the updater (Cloudflare Workers Builds is not used here).
          git worktree add --force "${DEPLOY_DIR}" "${{ steps.upstream.outputs.target_commit }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ env.DEPLOY_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "bun install failed (attempt ${attempt}), retrying..."
            sleep "$((15 * attempt))"
          done
          echo "bun install failed after 3 attempts" >&2
          exit 1

      - name: Build web and worker
        working-directory: ${{ env.DEPLOY_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          # Worker entry (esbuild) and the SPA assets it serves.
          bun run build:web
          bun run build:worker

      - name: Apply D1 migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun run db:migrate:remote

      - name: Deploy Worker
        id: deploy
        working-directory: ${{ env.DEPLOY_DIR }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGE_EVER_AUTH_PASSWORD: ${{ secrets.EDGE_EVER_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          cat > .env.local <<EOF
          EDGE_EVER_WORKER_NAME=${EDGE_EVER_WORKER_NAME}
          EDGE_EVER_WORKERS_DEV=${EDGE_EVER_WORKERS_DEV}
          EDGE_EVER_D1_DATABASE_NAME=${EDGE_EVER_D1_DATABASE_NAME}
          EDGE_EVER_D1_DATABASE_ID=${EDGE_EVER_D1_DATABASE_ID}
          EDGE_EVER_R2_BUCKET_NAME=${EDGE_EVER_R2_BUCKET_NAME}
          EDGE_EVER_CUSTOM_DOMAIN=${EDGE_EVER_CUSTOM_DOMAIN}
          EDGE_EVER_AUTH_USERNAME=${EDGE_EVER_AUTH_USERNAME}
          EDGE_EVER_AUTH_PASSWORD=${EDGE_EVER_AUTH_PASSWORD}
          EDGE_EVER_SESSION_TTL_DAYS=${EDGE_EVER_SESSION_TTL_DAYS}
          EDGE_EVER_AUTH_LOGIN_WINDOW_SECONDS=${EDGE_EVER_AUTH_LOGIN_WINDOW_SECONDS}
          EDGE_EVER_AUTH_LOGIN_USERNAME_MAX_ATTEMPTS=${EDGE_EVER_AUTH_LOGIN_USERNAME_MAX_ATTEMPTS}
          EDGE_EVER_AUTH_LOGIN_USERNAME_COOLDOWN_SECONDS=${EDGE_EVER_AUTH_LOGIN_USERNAME_COOLDOWN_SECONDS}
          EDGE_EVER_AUTH_LOGIN_IP_MAX_ATTEMPTS=${EDGE_EVER_AUTH_LOGIN_IP_MAX_ATTEMPTS}
          EDGE_EVER_AUTH_LOGIN_IP_COOLDOWN_SECONDS=${EDGE_EVER_AUTH_LOGIN_IP_COOLDOWN_SECONDS}
          EDGE_EVER_DEMO_MODE=${EDGE_EVER_DEMO_MODE}
          EOF
          bun run deploy:worker

      - name: Verify deployment
        shell: bash
        env:
          HEALTH_URL: ${{ env.EDGE_EVER_DEPLOYMENT_URL }}/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 15 "${HEALTH_URL}" || true)"
            if echo "${body}" | grep -q '"ok":true'; then
              echo "Health OK on attempt ${attempt}: ${body}"
              echo "health=${body}" >> "${GITHUB_OUTPUT}"
              {
                echo ""
                echo "**Health check passed / 健康检查通过**"
                echo ""
                echo '```json'
                echo "${body}"
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 6
          done
          echo "Health check never returned ok:true" >&2
          exit 1

      - name: Clean up worktree
        if: always()
        shell: bash
        run: git worktree remove --force "${DEPLOY_DIR}" || true
